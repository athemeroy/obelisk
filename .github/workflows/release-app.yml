name: Release macOS App

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing app version tag (for example v0.2.4)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-app-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Expected an app version tag such as v0.2.4 or v0.2.4-rc.1'
            exit 1
          fi
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Match tag to app and lockfile versions
        id: version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('app/package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('app/package-lock.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${pkg.version}` ||
              lock.version !== pkg.version || lock.packages[''].version !== pkg.version) {
            throw new Error('Release tag, app/package.json and app/package-lock.json must have the same version');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          NODE

      - name: Require signing and notarization credentials
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

  verify:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - run: npm ci
      - run: npm --prefix app ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Rebuild native modules for Electron
        working-directory: app
        # Node 22 hosts npm/build tools; Electron 43 runs the app with Node 24
        # and its own ABI. Never use a host-Node native build in the shipped app.
        run: npx --no-install electron-builder install-app-deps
      - run: npm --prefix app run test:electron:all

  build:
    needs: [prepare, verify]
    name: Sign and notarize (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - run: npm ci
      - run: npm --prefix app ci

      - name: Build, sign and notarize DMG and ZIP
        working-directory: app
        env:
          MAC_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          npm run dist:mac -- --"$MAC_ARCH" --publish never
          -c.mac.forceCodeSigning=true
          -c.mac.hardenedRuntime=true
          -c.mac.notarize=true

      - name: Verify the apps distributed in DMG and ZIP
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          MAC_ARCH: ${{ matrix.arch }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          verify_app() {
            local app="$1"
            codesign --verify --deep --strict --verbose=2 "$app"
            local signature
            signature=$(codesign --display --verbose=4 "$app" 2>&1)
            grep -F 'Authority=Developer ID Application:' <<< "$signature"
            grep -Fx "TeamIdentifier=$APPLE_TEAM_ID" <<< "$signature"
            grep -F '(runtime)' <<< "$signature"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
            APP_PATH="$app" EXPECTED_ARCH="$MAC_ARCH" ELECTRON_RUN_AS_NODE=1 \
              "$app/Contents/MacOS/Obelisk" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const resources = path.join(process.env.APP_PATH, 'Contents', 'Resources');
          const asar = path.join(resources, 'app.asar');
          assert.equal(process.arch, process.env.EXPECTED_ARCH);
          const lock = JSON.parse(fs.readFileSync('app/package-lock.json', 'utf8'));
          assert.equal(process.versions.electron, lock.packages['node_modules/electron'].version);
          for (const asset of ['out/main/index.js', 'out/main/indexer-worker.js',
            'out/preload/index.js', 'out/renderer/index.html']) {
            assert.ok(fs.existsSync(path.join(asar, asset)), `Missing packaged asset: ${asset}`);
          }
          const schema = fs.readFileSync(path.join(asar, 'out/main/schema.sql'), 'utf8');
          assert.equal(schema, fs.readFileSync('packages/core/src/schema.sql', 'utf8'));
          assert.equal(schema, fs.readFileSync(path.join(resources, 'scripts/schema.sql'), 'utf8'));
          const Database = require(path.join(asar, 'node_modules/better-sqlite3'));
          const db = new Database(':memory:');
          db.exec(schema);
          db.close();
          const watcher = require(path.join(asar, 'node_modules/@parcel/watcher'));
          assert.equal(typeof watcher.subscribe, 'function');
          console.log(JSON.stringify({ arch: process.arch, electron: process.versions.electron,
            node: process.versions.node, abi: process.versions.modules }));
          console.log('Packaged runtime, native modules and schema verified');
          NODE
          }
          dmg="app/release/Obelisk-$APP_VERSION-mac-$MAC_ARCH.dmg"
          zip="app/release/Obelisk-$APP_VERSION-mac-$MAC_ARCH.zip"
          work=$(mktemp -d "$RUNNER_TEMP/obelisk-verify.XXXXXX")
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$work/mount"
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$work/mount"
          mounted=true
          ditto "$work/mount/Obelisk.app" "$work/dmg/Obelisk.app"
          hdiutil detach "$work/mount"
          mounted=false
          verify_app "$work/dmg/Obelisk.app"
          ditto -x -k "$zip" "$work/zip"
          verify_app "$work/zip/Obelisk.app"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            app/release/Obelisk-${{ needs.prepare.outputs.version }}-mac-${{ matrix.arch }}.dmg
            app/release/Obelisk-${{ needs.prepare.outputs.version }}-mac-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-*
          merge-multiple: true
          path: release

      - name: Upload all four verified packages to a release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # Only reuse a draft. Never overwrite an already published release.
          existing=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft")
          if [[ "$existing" == false ]]; then
            echo '::error::Release is already published; use a new app version tag'
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            args=(--draft --verify-tag --title "Obelisk $RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" release/*.dmg release/*.zip --clobber
